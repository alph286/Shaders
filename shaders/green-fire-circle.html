<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Green Fire Circle</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* checkerboard just to visualize transparency while previewing */
    background-color: #1a1a1a;
    background-image:
      linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main() {
    gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2 iResolution;
uniform float iTime;

// ---- Hash / Noise (procedural-noise technique) ----
float hash(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

float noise(vec2 x) {
    vec2 p = floor(x);
    vec2 f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(p + vec2(0.0, 0.0));
    float b = hash(p + vec2(1.0, 0.0));
    float c = hash(p + vec2(0.0, 1.0));
    float d = hash(p + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

const mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
float fbm(vec2 p) {
    float f = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) {
        f += a * noise(p);
        p = m * p;
        a *= 0.5;
    }
    return f;
}

// ---- SDF (sdf-2d technique) ----
float sdCircle(vec2 p, float r) { return length(p) - r; }

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 p = (2.0 * fragCoord - iResolution.xy) / iResolution.y;
    float t = iTime;

    float radius = 0.55;
    float rad = length(p);
    float ang = atan(p.y, p.x);

    // domain-warped turbulence: noise feeds back into its own coordinates
    // so the flame looks chaotic instead of a radial "sunburst"
    vec2 q = p * 2.6;
    vec2 warpA = vec2(fbm(q + vec2(0.0, -t * 1.1)), fbm(q + vec2(5.2, -t * 0.9)));
    vec2 warped = q + (warpA - 0.5) * 1.8 - vec2(0.0, t * 0.6);
    float flame = fbm(warped * 1.7);
    flame = mix(flame, fbm(warped * 3.1 + warpA * 2.0), 0.35);

    // organic flickering edge (fire licks), still a closed filled disk
    float edgeNoise = fbm(vec2(ang * 3.0 - t * 0.6, t * 0.35)) * 0.05;
    float d = sdCircle(p, radius + edgeNoise);

    // anti-aliased fill mask: 1.0 strictly inside, 0.0 strictly outside
    float px = 1.5 / iResolution.y;
    float mask = smoothstep(px, -px, d);

    // heat value used for the green fire color ramp
    float heat = clamp(flame + 0.30, 0.0, 1.0);
    heat = pow(heat, 1.25);

    // brighter, hotter core toward the center of the disk
    float core = smoothstep(radius * 0.95, 0.0, rad);
    heat = mix(heat, clamp(heat + core * 0.5, 0.0, 1.0), 0.6);

    // green fire palette: deep green base -> vivid green -> yellow-green hot spots
    vec3 col;
    col.r = heat * heat * heat * 0.55;
    col.g = 0.22 + heat * 1.05;
    col.b = heat * heat * 0.22;
    col = clamp(col, 0.0, 1.0);

    fragColor = vec4(col * mask, mask);
}

void main() {
    mainImage(fragColor, gl_FragCoord.xy);
}
</script>
<script>
let startTime = Date.now();

const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false });
if (!gl) {
    alert('WebGL2 non supportato da questo browser.');
}

function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source.trim());
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
    }
    return shader;
}

const vsSource = document.getElementById('vs').text;
const fsSource = document.getElementById('fs').text;
const vs = compileShader(gl.VERTEX_SHADER, vsSource);
const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
}
gl.useProgram(program);

const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(program, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'iResolution');
const uTime = gl.getUniformLocation(program, 'iTime');

gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0, 0, 0, 0);

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

function render() {
    const time = (Date.now() - startTime) / 1000.0;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform1f(uTime, time);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
