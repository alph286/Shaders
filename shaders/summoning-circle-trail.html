<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Summoning Circle (Red Trail)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #1a1a1a;
    background-image:
      linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<!--
  Ported from "Summoning Circle" by Sam Gates (BackwardsCap), Shadertoy view/wllfR4.

  The original has 4 buffers: Buffer A procedurally draws the rune circle;
  Buffers B/C run a stable-fluid velocity simulation and Buffer S advects
  a dye/color field through it — both only ever perturbed by a webcam
  channel. This version keeps that fluid+dye trail effect (which the
  no-video build dropped, since it was permanently at rest without the
  webcam) but re-wires its forcing input: instead of "wherever the webcam
  sees motion", the trigger is now "wherever the rotating rune pattern is
  currently bright". As the ring spins, each newly-lit glyph kicks the
  fluid and injects red dye, which then gets advected/smeared by the
  velocity field and slowly decays — producing a red trail that chases
  the rotating runes. Buffer B and C (raw sim + smoothing pass) are
  merged into a single relaxation stage for simplicity; visually this
  is a very close match to the two-stage original.
-->
<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main() {
    gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>

<!-- Buffer A: procedural rune ring (unchanged from the plain rotating version) -->
<script id="fs-rune" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2 iResolution;
uniform float iTime;
uniform vec4 iDate;

#define R iResolution.xy
#define PI 3.1415927
#define m vec2(5. + 2. * 4., 10.)
#define PX (40. / R.y)
#define SS(U) smoothstep(PX, 0., U)
#define MORPH

float rand(vec2 p) {
    float d = iDate.w;
#ifdef MORPH
    vec2 pp = p / 20.0;
    d = floor(d * pp.x * pp.y) / 30.;
#endif
    return fract(sin(dot(p.xy, vec2(12389.1283, 8941.1283))) * (12893.128933) + cos(floor(d)));
}

mat2 rot(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }

// https://www.shadertoy.com/view/4llXD7
float B(vec2 p, vec2 b, vec4 r) {
    r.xy = p.x > 0.0 ? r.xy : r.zw;
    r.x = p.y > 0.0 ? r.x : r.y;
    vec2 q = abs(p) - b + r.x;
    return SS(min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r.x);
}

bool removedTile(float h, vec2 p) {
    vec2 lp = mod(p, m);
    float h2 = rand(vec2(20. + h * (floor(p.y)) + 10.84));
    if (lp.x >= 4. && lp.x < 11. || lp.y >= 6.) return true;
    return h * dot(h, h2) * 5. <= .5;
}

float C(vec2 p) { return SS(length(p - .5) - .4); }

float CL(vec2 p, float a) {
    vec2 bp = (p - .5);
    bp *= rot(PI / 4. * a);
    bp.x += .5;
    return B(bp, vec2(.6, .345), vec4(.3));
}

float CE(vec2 p, vec2 o) {
    return B((p + o) * rot(PI / 4.), vec2(.5), vec4(0));
}

float EL(vec2 p, float t) {
    vec2 b = vec2(.5, .4 - PX);
    p -= vec2(.5, .5);
    p *= rot(PI / 2. * t);
    p.x += PX;
    vec4 r = vec4(b.x - b.x / 2., b.x - b.x / 2., 0, 0);
    return B(p, b, r);
}

float D(vec2 p, float r) {
    p -= .5;
    p *= rot(PI / 2. * r);
    p += .13;
    float b1 = B(p, vec2(.5), vec4(.5, 0, 0, 0));
    p += .77;
    float b2 = B(p, vec2(.5), vec4(0, 0, 0, .025));
    return b1 - b2;
}

float T(vec2 p, float r) {
    p -= .5;
    p *= rot(PI / 2. * r);
    return B(p, vec2(.4 - PX, .6), vec4(0));
}

float render(vec2 p, float h) {
    bool neighbors[9];
    int ul = 6, u = 7, ur = 8, l = 3, me = 4, r = 5, dl = 0, d = 1, dr = 2;
    int n = 0;

    for (float y = -1.; y <= 1.; y++) {
        for (float x = -1.; x <= 1.; x++) {
            int i = int((x + 1.) + (y + 1.) * 3.);
            vec2 pos = floor(p + vec2(x, y));
            neighbors[i] = !removedTile(rand(pos), pos);
            if (i != me && neighbors[i]) n++;
        }
    }

    p = fract(p);

    if (neighbors[me]) {
        if (n == 0) return C(fract(p));

        if (neighbors[u] && neighbors[d]) {
            float o = T(p, 0.);
            if (neighbors[l]) o += EL(p + vec2(.175, 0), 0.);
            if (neighbors[r]) o += EL(p - vec2(.175, 0), 2.);
            return o;
        }
        if (neighbors[l] && neighbors[r]) {
            float o = T(p, 1.);
            if (neighbors[u]) o += EL(p - vec2(0, .25), 1.);
            if (neighbors[d]) o += EL(p + vec2(0, .25), 3.);
            return o;
        }
        if (neighbors[u] && !neighbors[d] && !neighbors[l] && !neighbors[r]) {
            float o = EL(p - vec2(0, .3), 1.);
            if (neighbors[dl]) o += CL(p - vec2(.175), 7.);
            if (neighbors[dr]) o += CL(p - vec2(-.175, .175), 5.);
            return o;
        }
        if (neighbors[d] && !neighbors[u] && !neighbors[l] && !neighbors[r]) {
            float o = EL(p + vec2(0, .3), 3.);
            if (neighbors[ul]) o += CL(p + vec2(-.175, .175), 1.);
            if (neighbors[ur]) o += CL(p + vec2(.175), 3.);
            return o;
        }
        if (neighbors[l] && !neighbors[r] && !neighbors[d] && !neighbors[u]) {
            float o = EL(p + vec2(.3, 0), 0.);
            if (neighbors[ur]) o += CL(p + vec2(.175, .175), 3.);
            if (neighbors[dr]) o += CL(p - vec2(-.175, .175), 5.);
            return o;
        }
        if (neighbors[r] && !neighbors[l] && !neighbors[d] && !neighbors[u]) {
            float o = EL(p - vec2(.3, 0), 2.);
            if (neighbors[ul]) o += CL(p + vec2(-.175, .175), 1.);
            if (neighbors[dl]) o += CL(p - vec2(.175), 7.);
            return o;
        }

        float j = 0.0;
        if (!neighbors[u] && neighbors[r] && !neighbors[l] && neighbors[d]) j += D(p, 3.);
        if (neighbors[u] && neighbors[r] && !neighbors[l] && !neighbors[d]) j += D(p, 2.);
        if (!neighbors[u] && !neighbors[r] && neighbors[l] && neighbors[d]) j += D(p, 0.);
        if (neighbors[u] && !neighbors[r] && neighbors[l] && !neighbors[d]) j += D(p, 1.);
        if (neighbors[ul] && !neighbors[l] && !neighbors[u]) j += CL(p + vec2(-.175, .175), 1.);
        if (neighbors[dl] && !neighbors[l] && !neighbors[d]) j += CL(p - vec2(.175), 7.);
        if (neighbors[ur] && !neighbors[r] && !neighbors[u]) j += CL(p + vec2(.175, .175), 3.);
        if (neighbors[dr] && !neighbors[r] && !neighbors[d]) j += CL(p - vec2(-.175, .175), 5.);
        return j;
    } else {
        float o = 0.0;
        if (!neighbors[ul] && neighbors[u] && neighbors[l]) o += CE(p, vec2(.07, -1.15));
        if (!neighbors[ur] && neighbors[u] && neighbors[r]) o += CE(p, vec2(-1.11));
        if (!neighbors[dl] && neighbors[d] && neighbors[l]) o += CE(p, vec2(.11));
        if (!neighbors[dr] && neighbors[d] && neighbors[r]) o += CE(p, vec2(-1.11, .11));
        return o;
    }
}

vec3 circle(vec2 f, vec2 u) {
    vec2 p = vec2(log(length(u.xy)), atan(u.y, u.x));
    p *= (6.0 / PI) * 10.85;
    p += vec2(5., 3.);
    p.y += iTime * 2.0;
    p.y = mod(p.y, 10.015 * 13.0) - .2;
    vec2 lp = p;
    p = floor(p);
    float hash = rand(p);

    vec3 col = vec3(0.0);
    if (p.x >= -5. && p.x <= 4.)
        col = vec3(clamp(render(lp, hash), 0., 1.)) * min(length(u) * 4., 1.);
    return col;
}

void main() {
    vec2 f = gl_FragCoord.xy;
    vec2 p = (2.0 * f - R) / R.y;
    vec3 rune = circle(f, p);
    float vign = 1.0 - smoothstep(0.85, 1.15, length(p));
    fragColor = vec4(rune * vign, 1.0);
}
</script>

<!-- Buffer B+C fused: stable-fluid relaxation, forced wherever the rune is bright -->
<script id="fs-fluid" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2 iResolution;
uniform sampler2D uFluid;
uniform sampler2D uRune;

#define R iResolution.xy
#define decay .9981

vec4 texFluid(vec2 p) { return texture(uFluid, p / R); }

void F(vec2 p, vec2 offset, vec4 s, inout vec2 v, inout float pr, inout float d, inout float n) {
    vec2 neighborPos = p + offset;
    vec2 backtraced = neighborPos - texFluid(neighborPos).xy;
    vec4 target = texFluid(backtraced);
    vec2 o = normalize(offset);
    v += o * (target.w - s.w);
    pr += target.w;
    d += dot(o, target.xy);
    n += 1.0;
}

void main() {
    vec2 p = gl_FragCoord.xy;
    vec4 s = texFluid(p - texFluid(p).xy);

    vec2 v = vec2(0.0);
    float d = 0.0, pr = 0.0, n = 0.0;
    F(p, vec2(0, 1), s, v, pr, d, n);
    F(p, vec2(0, -1), s, v, pr, d, n);
    F(p, vec2(1, 0), s, v, pr, d, n);
    F(p, vec2(-1, 0), s, v, pr, d, n);
    d /= n; pr /= n; v /= n;

    s.w = pr - d;
    s.xy -= v;
    s.z = d;
    s.xy *= decay;

    // forcing: original triggered on webcam motion ("if(S1(p).r>0.)");
    // here the trigger is "the rune pattern is lit up at this pixel"
    float mask = texture(uRune, p / R).r;
    vec2 centerVec = (2.0 * p - R) / R.y;
    if (mask > 0.15) {
        s.xy = -centerVec * 0.3;
    }

    if (p.x < 1. || p.y < 1. || R.x - p.x < 1. || R.y - p.y < 1.) s.xy *= 0.0;

    fragColor = s;
}
</script>

<!-- Buffer S: red dye advected through the fluid field, injected where the rune is bright -->
<script id="fs-dye" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2 iResolution;
uniform sampler2D uDye;
uniform sampler2D uFluid;
uniform sampler2D uRune;
uniform vec3 uTrailColor;

#define R iResolution.xy
#define decay .9981

void main() {
    vec2 f = gl_FragCoord.xy;
    for (int i = 0; i < 2; i++) {
        f -= texture(uFluid, f / R).xy;
    }

    vec4 state = texture(uDye, f / R);
    state *= decay;

    float mask = texture(uRune, gl_FragCoord.xy / R).r;
    if (mask > 0.1) {
        state.rgb += uTrailColor * 0.07;
    }

    fragColor = clamp(state, 0.0, 3.0);
}
</script>

<!-- Image: rune (white) + red dye trail, soft-blurred for glow, transparent background -->
<script id="fs-image" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2 iResolution;
uniform sampler2D uRune;
uniform sampler2D uDye;

#define R iResolution.xy

void main() {
    vec2 uv = gl_FragCoord.xy / R;
    vec3 rune = texture(uRune, uv).rgb;

    vec3 dye = vec3(0.0);
    vec2 texel = 1.0 / R;
    for (int y = -2; y <= 2; y++) {
        for (int x = -2; x <= 2; x++) {
            dye += texture(uDye, uv + vec2(float(x), float(y)) * texel * 1.5).rgb;
        }
    }
    dye /= 25.0;

    vec3 col = rune + dye * 1.6;
    col = clamp(col, 0.0, 1.0);
    float alpha = clamp(max(col.r, max(col.g, col.b)), 0.0, 1.0);
    fragColor = vec4(col, alpha);
}
</script>

<script>
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false });
if (!gl) {
    alert('WebGL2 non supportato da questo browser.');
}

const floatExt = gl.getExtension('EXT_color_buffer_float');
if (!floatExt) {
    console.warn('EXT_color_buffer_float non disponibile: la simulazione del fluido potrebbe non funzionare correttamente.');
}

function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source.trim());
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
    }
    return shader;
}

function createProgram(vsSource, fsSource) {
    const vs = compileShader(gl.VERTEX_SHADER, vsSource);
    const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
    }
    return program;
}

const vsSource = document.getElementById('vs').text;
const runeProgram = createProgram(vsSource, document.getElementById('fs-rune').text);
const fluidProgram = createProgram(vsSource, document.getElementById('fs-fluid').text);
const dyeProgram = createProgram(vsSource, document.getElementById('fs-dye').text);
const imageProgram = createProgram(vsSource, document.getElementById('fs-image').text);

const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

function bindQuad(program) {
    const aPos = gl.getAttribLocation(program, 'aPos');
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
}

let startTime = Date.now();
let width = 0, height = 0;

let runeTex, runeFBO;
let fluidTex = [null, null], fluidFBO = [null, null];
let dyeTex = [null, null], dyeFBO = [null, null];
let fluidIndex = 0, dyeIndex = 0;

function createTexture(internalFormat, format, type, filter) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, width, height, 0, format, type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
}

function createFBO(tex) {
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return fbo;
}

function setupBuffers() {
    runeTex = createTexture(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
    runeFBO = createFBO(runeTex);

    for (let i = 0; i < 2; i++) {
        fluidTex[i] = createTexture(gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, gl.LINEAR);
        fluidFBO[i] = createFBO(fluidTex[i]);
        dyeTex[i] = createTexture(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
        dyeFBO[i] = createFBO(dyeTex[i]);
    }

    gl.clearColor(0, 0, 0, 0);
    for (let i = 0; i < 2; i++) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fluidFBO[i]);
        gl.viewport(0, 0, width, height);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindFramebuffer(gl.FRAMEBUFFER, dyeFBO[i]);
        gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if (w === width && h === height) return;
    width = w; height = h;
    canvas.width = width;
    canvas.height = height;
    setupBuffers();
}
window.addEventListener('resize', resize);
resize();

const uResRune = gl.getUniformLocation(runeProgram, 'iResolution');
const uTimeRune = gl.getUniformLocation(runeProgram, 'iTime');
const uDateRune = gl.getUniformLocation(runeProgram, 'iDate');

const uResFluid = gl.getUniformLocation(fluidProgram, 'iResolution');
const uFluidFluid = gl.getUniformLocation(fluidProgram, 'uFluid');
const uRuneFluid = gl.getUniformLocation(fluidProgram, 'uRune');

const uResDye = gl.getUniformLocation(dyeProgram, 'iResolution');
const uDyeDye = gl.getUniformLocation(dyeProgram, 'uDye');
const uFluidDye = gl.getUniformLocation(dyeProgram, 'uFluid');
const uRuneDye = gl.getUniformLocation(dyeProgram, 'uRune');
const uTrailColorDye = gl.getUniformLocation(dyeProgram, 'uTrailColor');

const uResImage = gl.getUniformLocation(imageProgram, 'iResolution');
const uRuneImage = gl.getUniformLocation(imageProgram, 'uRune');
const uDyeImage = gl.getUniformLocation(imageProgram, 'uDye');

// red trail color — tweak here (rgb, 0-1)
const TRAIL_COLOR = [1.0, 0.1, 0.05];

function render() {
    const time = (Date.now() - startTime) / 1000.0;
    const now = new Date();
    const secondsSinceMidnight = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() * 0.001;

    // 1. rune pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, runeFBO);
    gl.viewport(0, 0, width, height);
    gl.disable(gl.BLEND);
    gl.useProgram(runeProgram);
    bindQuad(runeProgram);
    gl.uniform2f(uResRune, width, height);
    gl.uniform1f(uTimeRune, time);
    gl.uniform4f(uDateRune, now.getFullYear(), now.getMonth(), now.getDate(), secondsSinceMidnight);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 2. fluid pass (ping-pong)
    const fluidRead = fluidIndex;
    const fluidWrite = 1 - fluidIndex;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fluidFBO[fluidWrite]);
    gl.viewport(0, 0, width, height);
    gl.useProgram(fluidProgram);
    bindQuad(fluidProgram);
    gl.uniform2f(uResFluid, width, height);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fluidTex[fluidRead]);
    gl.uniform1i(uFluidFluid, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, runeTex);
    gl.uniform1i(uRuneFluid, 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    fluidIndex = fluidWrite;

    // 3. dye pass (ping-pong)
    const dyeRead = dyeIndex;
    const dyeWrite = 1 - dyeIndex;
    gl.bindFramebuffer(gl.FRAMEBUFFER, dyeFBO[dyeWrite]);
    gl.viewport(0, 0, width, height);
    gl.useProgram(dyeProgram);
    bindQuad(dyeProgram);
    gl.uniform2f(uResDye, width, height);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, dyeTex[dyeRead]);
    gl.uniform1i(uDyeDye, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fluidTex[fluidIndex]);
    gl.uniform1i(uFluidDye, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, runeTex);
    gl.uniform1i(uRuneDye, 2);
    gl.uniform3f(uTrailColorDye, TRAIL_COLOR[0], TRAIL_COLOR[1], TRAIL_COLOR[2]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    dyeIndex = dyeWrite;

    // 4. final composite to screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, width, height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(imageProgram);
    bindQuad(imageProgram);
    gl.uniform2f(uResImage, width, height);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, runeTex);
    gl.uniform1i(uRuneImage, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, dyeTex[dyeIndex]);
    gl.uniform1i(uDyeImage, 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
