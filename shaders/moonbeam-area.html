<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Moonbeam (Water Reflection)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #1a1a1a;
    background-image:
      linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<!--
  D&D 5e "Moonbeam" (Bagliore lunare) area, styled as sunlight/moonlight
  caustics on rippling water (per reference photo), rendered in white and
  silver only instead of the photo's blue. The caustic network uses the
  well-known "interfering sine waves" procedural caustics technique
  (see e.g. https://www.shadertoy.com/view/MdlXz8 for the classic form):
  a handful of iterations where each step's sample position is itself
  warped by cosines/sines of the previous one, then turned into bright
  filaments by taking 1/length() of a further sine-warped vector — small
  input changes make huge output swings exactly where wavefronts cross,
  which is what makes it look like real caustic light. On top of that,
  soft round twinkling highlights stand in for the photo's bigger bokeh
  glints. Circular soft-edged area, transparent background.
-->
<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main() {
    gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

// Procedural water caustics (classic "interfering sines" form). The
// magic constants here (the -250 offset, inten=0.005, 1.17/1.4/8) are a
// matched set tuned for p living at a large-magnitude offset — changing
// the coordinate scale without keeping the offset breaks the balance and
// the whole field saturates to one flat value (learned this the hard way).
float caustics(vec2 uv, float time) {
    const float TAU = 6.28318530718;
    vec2 p = mod(uv * TAU, TAU) - 250.0;
    vec2 i = p;
    float c = 1.0;
    const float inten = 0.005;
    for (int n = 0; n < 5; n++) {
        float t = time * (1.0 - (3.5 / float(n + 1)));
        i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
        vec2 denom = vec2(sin(i.x + t), cos(i.y + t)) / inten;
        c += 1.0 / length(vec2(p.x, p.y) / denom);
    }
    c /= 5.0;
    c = 1.17 - pow(c, 1.4);
    return clamp(pow(abs(c), 8.0), 0.0, 1.0);
}

// Soft round twinkling highlight per jittered cell (the photo's bokeh glints)
float bokeh(vec2 p, float scale, float time) {
    vec2 gp = p * scale;
    vec2 n = floor(gp);
    vec2 f = fract(gp);
    float best = 0.0;
    for (int j = -1; j <= 1; j++) {
        for (int i = -1; i <= 1; i++) {
            vec2 g = vec2(float(i), float(j));
            vec2 o = vec2(hash(n + g), hash(n + g + 17.3));
            float twinkle = 0.5 + 0.5 * sin(time * 2.2 + hash(n + g + 4.1) * 30.0);
            float d = length(f - g - o);
            float spot = smoothstep(0.22, 0.0, d) * pow(twinkle, 3.0);
            best = max(best, spot);
        }
    }
    return best;
}

void main() {
    vec2 p = (2.0 * gl_FragCoord.xy - iResolution.xy) / iResolution.y;
    float t = iTime;
    float rad = length(p);

    // gentle wave distortion so the whole caustic field drifts like a
    // real water surface instead of just cycling in place
    vec2 wp = p * 2.6 + vec2(sin(t * 0.15), cos(t * 0.12)) * 0.3;
    float causticPattern = caustics(wp, t * 0.6);
    causticPattern = pow(causticPattern, 0.7); // widen the bright filaments

    float glints = max(bokeh(p, 3.2, t), bokeh(p + 5.3, 6.5, t * 1.3) * 0.8);

    float pattern = clamp(causticPattern * 1.1 + glints * 0.9, 0.0, 1.0);

    // soft circular falloff, brightest toward the center
    float baseRadius = 0.5;
    float feather = 0.42;
    float falloff = 1.0 - smoothstep(baseRadius - feather, baseRadius + feather, rad);

    // white & silver only — a cool light-grey base rising to pure white
    // at the brightest caustic filaments/glints, no blue tint
    vec3 col = mix(vec3(0.62, 0.63, 0.66), vec3(1.0), pattern);

    float baseGlow = 0.68;
    float alpha = clamp((baseGlow + pattern * 0.45) * falloff, 0.0, 0.95);
    fragColor = vec4(col * alpha, alpha);
}
</script>
<script>
let startTime = Date.now();

const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false });
if (!gl) {
    alert('WebGL2 non supportato da questo browser.');
}

function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source.trim());
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
    }
    return shader;
}

const vsSource = document.getElementById('vs').text;
const fsSource = document.getElementById('fs').text;
const vs = compileShader(gl.VERTEX_SHADER, vsSource);
const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
}
gl.useProgram(program);

const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(program, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'iResolution');
const uTime = gl.getUniformLocation(program, 'iTime');

// The fragment shader outputs premultiplied color (col*alpha, alpha), so
// the source RGB blend factor must be ONE, not SRC_ALPHA — otherwise
// alpha gets applied twice and crushes every translucent pixel toward
// invisible (only the brightest, near-opaque glints would survive).
gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0, 0, 0, 0);

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

function render() {
    const time = (Date.now() - startTime) / 1000.0;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform1f(uTime, time);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
