<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Moonbeam (Water Reflection)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #1a1a1a;
    background-image:
      linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<!--
  D&D 5e "Moonbeam" (Bagliore lunare) area, styled as the moon's broken
  reflection on rippling water rather than a misty light column: rippled
  bright bands (water-ocean-style wave distortion) plus fine twinkling
  glints (a thresholded, time-phased sparkle field), pale silver-white,
  contained in a soft-edged circle. Transparent background.
-->
<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main() {
    gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

float noise(vec2 x) {
    vec2 p = floor(x);
    vec2 f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(p + vec2(0.0, 0.0));
    float b = hash(p + vec2(1.0, 0.0));
    float c = hash(p + vec2(0.0, 1.0));
    float d = hash(p + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

const mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
float fbm(vec2 p) {
    float f = 0.0, a = 0.5;
    for (int i = 0; i < 4; i++) {
        f += a * noise(p);
        p = m * p;
        a *= 0.5;
    }
    return f;
}

void main() {
    vec2 p = (2.0 * gl_FragCoord.xy - iResolution.xy) / iResolution.y;
    float t = iTime;
    float rad = length(p);

    // water ripples: a couple of travelling sine waves distort the
    // sampling coordinate, like wavelets crossing the surface
    float waveA = sin(p.x * 6.0 + t * 1.1) * 0.05;
    float waveB = sin(p.x * 11.0 - t * 1.7 + p.y * 4.0) * 0.025;
    vec2 rp = vec2(p.x, p.y + waveA + waveB);

    // broken horizontal reflection streaks
    float band = fbm(vec2(rp.x * 2.2, rp.y * 8.0 - t * 0.5));
    float streak = smoothstep(0.3, 0.85, band);

    // fine twinkling glints: small cells that flash briefly and randomly
    vec2 cell = floor(rp * 42.0);
    float seed = hash(cell);
    float twinkle = pow(0.5 + 0.5 * sin(t * 5.0 + seed * 40.0), 5.0);
    float glint = step(0.965, hash(cell + 0.37)) * twinkle;

    float pattern = clamp(streak * 0.55 + glint * 1.6, 0.0, 1.0);

    // soft circular falloff, brightest toward the center
    float baseRadius = 0.5;
    float feather = 0.42;
    float falloff = 1.0 - smoothstep(baseRadius - feather, baseRadius + feather, rad);

    // a clearly-visible pool of pale water-color fills the whole circle;
    // streaks/glints are brighter texture layered on top, not the only
    // thing keeping the area from being transparent
    vec3 col = mix(vec3(0.58, 0.68, 0.85), vec3(0.92, 0.95, 1.0), pattern);

    float baseGlow = 0.78;
    float alpha = clamp((baseGlow + pattern * 0.3) * falloff, 0.0, 0.95);
    fragColor = vec4(col * alpha, alpha);
}
</script>
<script>
let startTime = Date.now();

const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false });
if (!gl) {
    alert('WebGL2 non supportato da questo browser.');
}

function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source.trim());
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
    }
    return shader;
}

const vsSource = document.getElementById('vs').text;
const fsSource = document.getElementById('fs').text;
const vs = compileShader(gl.VERTEX_SHADER, vsSource);
const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
}
gl.useProgram(program);

const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(program, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'iResolution');
const uTime = gl.getUniformLocation(program, 'iTime');

// The fragment shader outputs premultiplied color (col*alpha, alpha), so
// the source RGB blend factor must be ONE, not SRC_ALPHA — otherwise
// alpha gets applied twice and crushes every translucent pixel toward
// invisible (only the brightest, near-opaque glints would survive).
gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0, 0, 0, 0);

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

function render() {
    const time = (Date.now() - startTime) / 1000.0;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform1f(uTime, time);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
